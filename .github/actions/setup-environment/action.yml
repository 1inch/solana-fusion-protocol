name: "Setup Environment"
description: "Setup the environment for the workflow"
inputs:
  node-version:
    description: "Node.js version"
    required: true
    default: "lts/*"
  rustc-version:
    description: "Rust version"
    required: true
    default: "1.89.0"
  solana-version:
    description: "Solana version"
    required: true
    # 3.1.14 defaults to platform-tools v1.52 (Rust 1.89). CLI 2.3 and 3.0
    # default to Rust 1.84, which cannot compile edition 2024.
    # Agave 4.x refuses the v0 binaries Anchor 0.32.2 still builds.
    default: "v3.1.14"

runs:
  using: "composite"
  steps:
    # Yarn
    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'yarn'

    - shell: bash
      run: yarn

    # Anchor requires this library to be installed on the system.
    - shell: bash
      run: sudo apt-get install libudev-dev

    # Rust and Cargo
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.rustc-version }}
        components: clippy, rustfmt

    # Anchor builds the IDL with `cargo +stable`, which ignores rust-toolchain.toml.
    - shell: bash
      run: rustup toolchain install stable --profile minimal

    - name: Cache Cargo dependencies
      uses: Swatinem/rust-cache@v2

    # Solana
    - name: Cache Solana CLI
      id: cache-solana
      uses: actions/cache@v6
      with:
        path: ~/.local/share/solana
        key: solana-${{ runner.os }}-${{ inputs.solana-version }}
        restore-keys: solana-${{ runner.os }}-

    - name: Install Solana CLI (if cache is not hit)
      shell: bash
      if: steps.cache-solana.outputs.cache-hit != 'true'
      run: sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
      env:
        SOLANA_VERSION: ${{ inputs.solana-version }}

    - name: Add Solana CLI to PATH
      shell: bash
      run: echo "/home/runner/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

    - name: Create Solana Wallet
      shell: bash
      run: solana-keygen new --no-bip39-passphrase

    # Anchor
    - name: Install Anchor CLI
      shell: bash
      run: cargo install anchor-cli --version 0.32.2

    # Verifications
    - name: Verify Yarn installation
      shell: bash
      run: yarn --version

    - name: Verify Cargo installation
      shell: bash
      run: cargo version

    - name: Verify Solana installation
      shell: bash
      run: solana --version

    - name: Verify Anchor CLI installation
      shell: bash
      run: anchor --version
